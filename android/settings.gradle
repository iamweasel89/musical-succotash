pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localPropertiesFile = file("local.properties")
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withInputStream { properties.load(it) }
        }
        // Prefer local.properties, fall back to FLUTTER_ROOT env var
        def path = properties.getProperty("flutter.sdk") ?: System.getenv("FLUTTER_ROOT")
        assert path != null,
            "Flutter SDK not found. Set flutter.sdk in local.properties or FLUTTER_ROOT env var."
        return path
    }()

    includeBuild("${flutterSdkPath}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.3.0" apply false
    id "org.jetbrains.kotlin.android" version "1.9.22" apply false
}

include ":app"
