<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Выделение объектов по цвету</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Выделение объектов по цвету</h1>

    <div class="video-wrapper">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>
      <div class="placeholder" id="placeholder">
        <span>Нажмите «Включить камеру»</span>
      </div>
    </div>

    <div class="controls">
      <!-- Camera actions -->
      <div class="actions">
        <button id="startBtn">Включить камеру</button>
        <button id="stopBtn" disabled>Выключить</button>
        <button id="flipBtn" disabled>Перевернуть камеру</button>
        <button id="clearBtn" disabled>Сбросить цвет</button>
      </div>

      <!-- Hint -->
      <p class="hint" id="hint"></p>

      <!-- Picked color preview -->
      <div class="color-row" id="colorRow" style="display:none">
        <div class="color-preview" id="colorPreview"></div>
        <span class="color-hex" id="colorHex">#000000</span>
        <span class="color-label">— выбранный цвет</span>
      </div>

      <!-- Sliders -->
      <div class="sliders">
        <div class="slider-row">
          <label>Допуск <span class="val" id="toleranceVal">60</span></label>
          <input type="range" id="tolerance" min="1" max="150" value="60" />
        </div>
        <div class="slider-row">
          <label>Интенсивность подсветки <span class="val" id="opacityVal">70%</span></label>
          <input type="range" id="opacity" min="0" max="100" value="70" />
        </div>
        <div class="slider-row">
          <label>Цвет подсветки</label>
          <input type="color" id="highlightColor" value="#ffff00" />
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
