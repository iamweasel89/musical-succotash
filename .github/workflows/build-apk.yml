name: Build APK

on:
  push:
    branches: [ "claude/add-camera-video-filtering-JCEuN", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Install Android SDK platform
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Copy web assets into Android project
        run: cp index.html style.css app.js android/app/src/main/assets/

      - name: Build debug APK
        run: gradle assembleDebug
        working-directory: android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: color-filter-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
