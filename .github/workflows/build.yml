name: Build

on:
  push:
    branches: ["**"]

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.x"
          channel: stable
          cache: true

      - name: Write android/local.properties
        run: |
          FLUTTER_SDK=$(dirname $(dirname $(which flutter)))
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT"  >> android/local.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hex-canvas-mobile-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish GitHub release
        run: |
          gh release create "build-${{ github.run_number }}" \
            --title "Build ${{ github.run_number }}" \
            --notes "Commit: ${{ github.sha }}" \
            --latest \
            build/app/outputs/flutter-apk/app-release.apk#hex-canvas.apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
